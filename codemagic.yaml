# Codemagic builds for the iPhone (project type "Other": the Xcode project is generated by CMake on the build machine).
#
#   ios-check       unsigned Release build: proves the code and the Metal shaders compile. Needs no Apple account.
#   ios-testflight  signed build uploaded to TestFlight, to install on the phone. Needs, in Codemagic:
#                     - Teams > Integrations > Developer Portal: an App Store Connect API key, named below (FLY_ASC_KEY)
#                     - the bundle id com.ovoa.flybasic registered, and an app record for it in App Store Connect
#                     - an environment group "apple" with APPLE_TEAM_ID (the 10-character team id)
workflows:
  ios-check:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events: [push]
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: CMake and the Metal toolchain
        script: |
          command -v cmake || brew install cmake
          # Xcode 26 ships without the Metal shader compiler: fetch it unless this image already has it. If it still will not
          # run (the download can mismatch the image's Xcode), build without the offline metallib: the app then compiles the
          # bundled msl/*.metal at launch.
          xcrun --sdk iphoneos metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          if xcrun --sdk iphoneos metal -v; then echo "FLY_OFFLINE_METAL=ON" >> $CM_ENV
          else echo "Metal toolchain unusable here: shaders compile on the device"; echo "FLY_OFFLINE_METAL=OFF" >> $CM_ENV; fi
      - name: Generate the Xcode project
        script: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DFLY_OFFLINE_METAL=$FLY_OFFLINE_METAL
      - name: Build (Release, unsigned)
        script: |
          set -o pipefail
          cmake --build build-ios --config Release -- -sdk iphoneos CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -60
      - name: Package an unsigned .ipa (for sideloading tools that sign it with your Apple ID)
        script: |
          rm -rf Payload && mkdir Payload && cp -R build-ios/Release-iphoneos/fly_engine.app Payload/
          zip -qry fly_engine_unsigned.ipa Payload
    artifacts:
      - build.log
      - fly_engine_unsigned.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: FLY_ASC_KEY
    environment:
      xcode: latest
      groups:
        - apple
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ovoa.flybasic
    scripts:
      - name: CMake and the Metal toolchain
        script: |
          command -v cmake || brew install cmake
          # Xcode 26 ships without the Metal shader compiler: fetch it unless this image already has it. If it still will not
          # run (the download can mismatch the image's Xcode), build without the offline metallib: the app then compiles the
          # bundled msl/*.metal at launch.
          xcrun --sdk iphoneos metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          if xcrun --sdk iphoneos metal -v; then echo "FLY_OFFLINE_METAL=ON" >> $CM_ENV
          else echo "Metal toolchain unusable here: shaders compile on the device"; echo "FLY_OFFLINE_METAL=OFF" >> $CM_ENV; fi
      - name: Generate the Xcode project (signed with the team)
        script: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DFLY_OFFLINE_METAL=$FLY_OFFLINE_METAL \
            -DFLY_TEAM_ID="$APPLE_TEAM_ID" -DFLY_BUNDLE_ID=com.ovoa.flybasic -DFLY_BUILD_NUMBER="$BUILD_NUMBER"
      - name: Signing profiles
        script: xcode-project use-profiles --project build-ios/FlyEngine.xcodeproj
      - name: Build the .ipa
        script: |
          xcode-project build-ipa --project build-ios/FlyEngine.xcodeproj --scheme fly_engine --config Release \
            --archive-flags="-destination 'generic/platform=iOS' CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
